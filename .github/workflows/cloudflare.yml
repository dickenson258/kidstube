# 推送到 main 后，构建 dist/（scripts/build.mjs）并发布到 Cloudflare Pages（项目 domibuddy，配置见 wrangler.toml）
# 需要：仓库 Secret CLOUDFLARE_API_TOKEN（权限：Account → Cloudflare Pages → Edit）
#       仓库 Variable CLOUDFLARE_ACCOUNT_ID
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (bundle + minify + version stamps)
        run: node scripts/build.mjs
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.160.1 pages deploy --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --pretty=%s)"
